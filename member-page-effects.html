<!-- ============================================================
     MEMBER PAGE EFFECTS: kevinn.html, guirlyn.html, angela.html, kelly.html
     I did not have these four pages, so this is the exact change for each one.

     1) In <head>, after your existing stylesheet links, add:

        <link rel="stylesheet" href="effects.css">
        <link rel="stylesheet" href="members-fx.css">

     2) On the page's top section, add the class "has-fx" and that member's
        colour class, e.g. for Guirlyn:

        <section id="home" class="hero has-fx m-purple"> ... </section>

        Colour classes: Kevinn m-red, Guirlyn m-purple, Angela m-cyan, Kelly m-orange.

     3) Make the block below the FIRST child of that section:
     ============================================================= -->
<div class="hero-fx" aria-hidden="true">
<span class="fx-cube fx-cube--1"><span class="cube"><i></i><i></i><i></i><i></i></span></span>
<span class="fx-cube fx-cube--2"><span class="cube"><i></i><i></i><i></i><i></i></span></span>
<span class="fx-cube fx-cube--3"><span class="cube"><i></i><i></i><i></i><i></i></span></span>
<span class="fx-cube fx-cube--4"><span class="cube"><i></i><i></i><i></i><i></i></span></span>
<span class="fx-trace fx-trace--1"></span>
<span class="fx-trace fx-trace--2"></span>
</div>
